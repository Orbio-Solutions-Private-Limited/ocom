name: Deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Admin assets
        working-directory: packages/Webkul/Admin
        run: npm install && npm run build

      - name: Build Shop assets
        working-directory: packages/Webkul/Shop
        run: npm install && npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.FLEETBASE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 18.227.153.62 >> ~/.ssh/known_hosts

      - name: Sync application
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'vendor/' \
            --exclude 'storage/' \
            --exclude 'bootstrap/cache/' \
            --exclude 'node_modules/' \
            --exclude 'public/storage' \
            --exclude '.git/' \
            ./ ubuntu@18.227.153.62:/opt/orbio/ocom/

      - name: Run deploy
        run: ssh ubuntu@18.227.153.62 'bash /opt/orbio/ocom/deploy/deploy.sh'
